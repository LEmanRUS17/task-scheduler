framework:
    cache:
        # Fixed seed so the Redis key namespace of cache.app doesn't depend on APP_ENV/APP_DEBUG:
        # the API (php container) and the consumer (prod) must see the same keys, e.g. telegram link tokens.
        prefix_seed: task-scheduler
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            app: cache.adapter.array
