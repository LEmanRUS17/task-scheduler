security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\UserFeature\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        app_users:
            id: App\UserFeature\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            user_checker: App\UserFeature\Infrastructure\Security\UserChecker
            entry_point: jwt
            json_login:
                check_path: /auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            refresh_jwt:
                check_path: /auth/token/refresh
                # gesdinet LogoutEventListener invalidates the refresh token
                # when the logout below is triggered (default true, explicit for intent).
                invalidate_token_on_logout: true
            jwt: ~
            logout:
                # Stateless JWT firewall: no session to clear. The logout route is
                # generated by security.route_loader.logout (config/routes/security.yaml).
                # gesdinet's LogoutEventListener handles refresh-token invalidation,
                # so CSRF protection is left disabled (no browser session involved).
                path: /auth/logout

    access_control:
        - { path: ^/auth/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/auth, roles: PUBLIC_ACCESS }
        - { path: ^/analytics, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
