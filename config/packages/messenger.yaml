framework:
    messenger:
        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: ~
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true

        transports:
            sync: 'sync://'
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            notifications:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: notifications
                        type: direct
                        default_publish_routing_key: notification
                serializer: App\NotificationFeature\Infrastructure\Messenger\Serializer\NotificationDispatchMessageSerializer

        routing:
            App\TaskFeature\Infrastructure\Messenger\Message\TaskStatusChangedMessage: async
            App\TaskFeature\Infrastructure\Messenger\Message\TaskCreatedMessage: async
            App\TaskFeature\Infrastructure\Messenger\Message\TaskAssigneeAddedMessage: async
            App\NotificationFeature\Infrastructure\Messenger\Message\NotificationDispatchMessage: notifications
            App\SearchFeature\Infrastructure\Messenger\Message\IndexTaskMessage: async
            App\AnalyticsFeature\Infrastructure\Messenger\Message\RecordTaskEventMessage: async
            App\AnalyticsFeature\Infrastructure\Messenger\Message\RecordTaskActionMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                notifications: 'in-memory://'
