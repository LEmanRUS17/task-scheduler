# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/**/Persistence/Doctrine/Mapping/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\UserFeatureApi\Service\UserServiceInterface:
        class: App\UserFeature\Application\ApiService\UserApiService

    App\UserFeature\Domain\Port\ClockInterface:
        class: App\UserFeature\Infrastructure\Clock\SystemClock

    App\UserFeature\Infrastructure\Messenger\MessengerDomainEventDispatcher:
        arguments:
            $eventBus: '@event.bus'

    App\UserFeature\Infrastructure\Persistence\Doctrine\UserDoctrineMapping:
        tags:
            - { name: doctrine.event_listener, event: loadClassMetadata }

    App\ProfileFeatureApi\Service\ProfileServiceInterface:
        class: App\ProfileFeature\Application\ApiService\ProfileApiService

    App\ProfileFeature\Domain\Port\ClockInterface:
        class: App\ProfileFeature\Infrastructure\Clock\SystemClock

    App\TeamFeatureApi\Service\TeamServiceInterface:
        class: App\TeamFeature\Application\ApiService\TeamApiService

    App\TeamFeature\Domain\Port\ClockInterface:
        class: App\TeamFeature\Infrastructure\Clock\SystemClock

    App\TeamFeature\Domain\Port\DomainEventDispatcherInterface:
        class: App\TeamFeature\Infrastructure\Messenger\MessengerDomainEventDispatcher
        arguments:
            $eventBus: '@event.bus'

    App\TeamFeature\Domain\Repository\TeamRepositoryInterface:
        class: App\TeamFeature\Infrastructure\Persistence\DoctrineTeamRepository

    App\TeamFeature\Application\DTORequestValidator\TeamValidatorInterface:
        class: App\TeamFeature\Application\DTORequestValidator\TeamValidator

    App\TeamFeature\Domain\Repository\TeamMemberRepositoryInterface:
        class: App\TeamFeature\Infrastructure\Persistence\DoctrineTeamMemberRepository

    App\TaskFeatureApi\Service\TaskServiceInterface:
        class: App\TaskFeature\Application\ApiService\TaskApiService

    App\TaskFeature\Domain\Port\ClockInterface:
        class: App\TaskFeature\Infrastructure\Clock\SystemClock

    App\TaskFeature\Domain\Port\DomainEventDispatcherInterface:
        class: App\TaskFeature\Infrastructure\Messenger\MessengerDomainEventDispatcher
        arguments:
            $eventBus: '@event.bus'

    App\TaskFeature\Domain\Repository\TaskRepositoryInterface:
        class: App\TaskFeature\Infrastructure\Persistence\DoctrineTaskRepository

    App\TaskFeature\Application\DTORequestValidator\TaskValidatorInterface:
        class: App\TaskFeature\Application\DTORequestValidator\TaskValidator

    App\TaskFeature\Domain\Port\TaskWorkflowInterface:
        class: App\TaskFeature\Infrastructure\Workflow\SymfonyTaskWorkflow

    App\TaskFeature\Domain\Port\TeamMembershipInterface:
        class: App\TaskFeature\Infrastructure\Team\TeamMembershipChecker

    Symfony\Component\Workflow\Registry: ~

    App\WorkflowFeatureApi\Service\WorkflowServiceInterface:
        class: App\WorkflowFeature\Application\ApiService\WorkflowApiService

    App\WorkflowFeature\Domain\Port\ClockInterface:
        class: App\WorkflowFeature\Infrastructure\Clock\SystemClock

    App\WorkflowFeature\Domain\Port\DomainEventDispatcherInterface:
        class: App\WorkflowFeature\Infrastructure\Messenger\MessengerDomainEventDispatcher
        arguments:
            $eventBus: '@event.bus'

    App\WorkflowFeature\Domain\Repository\WorkflowRepositoryInterface:
        class: App\WorkflowFeature\Infrastructure\Persistence\DoctrineWorkflowRepository

    App\WorkflowFeature\Domain\Repository\WorkflowStatusRepositoryInterface:
        class: App\WorkflowFeature\Infrastructure\Persistence\DoctrineWorkflowStatusRepository

    App\WorkflowFeature\Domain\Repository\WorkflowTransitionRepositoryInterface:
        class: App\WorkflowFeature\Infrastructure\Persistence\DoctrineWorkflowTransitionRepository

    App\WorkflowFeature\Application\DTORequestValidator\WorkflowValidatorInterface:
        class: App\WorkflowFeature\Application\DTORequestValidator\WorkflowValidator

    App\AuditLogFeature\Domain\Repository\AuditEntryRepositoryInterface:
        class: App\AuditLogFeature\Infrastructure\Persistence\DoctrineAuditEntryRepository

    App\AuditLogFeature\Infrastructure\Doctrine\Subscriber\AuditDoctrineSubscriber:
        tags:
            - { name: doctrine.event_listener, event: onFlush }


    App\NotificationFeature\Infrastructure\Messenger\EventSubscriber\TaskNotificationSubscriber:
        arguments:
            $defaultBus: '@messenger.bus.default'
    App\SearchFeature\Infrastructure\Manticore\ManticoreClient:
        arguments:
            $baseUrl: '%env(MANTICORE_URL)%'

    App\SearchFeature\Domain\Port\TaskSearchIndexInterface:
        class: App\SearchFeature\Infrastructure\Manticore\ManticoreTaskSearchIndex

    App\SearchFeature\Domain\Port\TeamSearchIndexInterface:
        class: App\SearchFeature\Infrastructure\Manticore\ManticoreTeamSearchIndex

    App\SearchFeature\Infrastructure\Messenger\EventSubscriber\TaskSearchIndexSubscriber:
        arguments:
            $defaultBus: '@messenger.bus.default'

    App\SearchFeature\Infrastructure\Messenger\EventSubscriber\TeamSearchIndexSubscriber:
        arguments:
            $defaultBus: '@messenger.bus.default'

    App\SearchFeatureApi\Contract\SearchServiceInterface:
        class: App\SearchFeature\Application\ApiService\SearchApiService

    App\SearchFeature\Domain\Port\TaskSearchRepositoryInterface:
        class: App\SearchFeature\Infrastructure\Manticore\ManticoreTaskSearchRepository

    App\SearchFeature\Domain\Port\TeamSearchRepositoryInterface:
        class: App\SearchFeature\Infrastructure\Manticore\ManticoreTeamSearchRepository
    App\AnalyticsFeature\Infrastructure\ClickHouse\ClickHouseClient:
        arguments:
            $baseUrl: '%env(CLICKHOUSE_URL)%'
            $user: '%env(CLICKHOUSE_USER)%'
            $password: '%env(CLICKHOUSE_PASSWORD)%'

    App\AnalyticsFeature\Domain\Port\TaskEventStorageInterface:
        class: App\AnalyticsFeature\Infrastructure\ClickHouse\ClickHouseTaskEventStorage

    App\AnalyticsFeature\Infrastructure\Messenger\EventSubscriber\TaskAnalyticsSubscriber:
        arguments:
            $defaultBus: '@messenger.bus.default'

    App\AnalyticsFeature\Domain\Port\TaskActionStorageInterface:
        class: App\AnalyticsFeature\Infrastructure\ClickHouse\ClickHouseTaskActionStorage

    App\AnalyticsFeatureApi\Contract\AnalyticsServiceInterface:
        class: App\AnalyticsFeature\Application\ApiService\AnalyticsApiService

    App\AnalyticsFeature\Domain\Port\AnalyticsQueryInterface:
        class: App\AnalyticsFeature\Infrastructure\ClickHouse\ClickHouseAnalyticsQuery
